# Accurit edge reverse proxy.
#
# Public routing (HTTP):
#   /            -> web:3000    (Next.js)
#   /admin/      -> admin:80    (Angular)
#   /app/        -> client:80   (Angular)
#   /login       -> 301 /app/login
#   /api/        -> backend:8080 (Rust/Axum)
#
# TLS termination is intentionally not enabled here. To serve HTTPS, add a
# `server { listen 443 ssl; ... }` block (or use an external load balancer),
# mount the certificate files read-only under /etc/nginx/certs and publish
# port 443 in docker-compose.yml.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time" '
                    'rid=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/xml application/json
                      application/javascript text/javascript image/svg+xml
                      application/font-woff font/woff2;

    map $http_x_request_id $req_id {
        "~^[0-9A-Za-z_-]{8,64}$" $http_x_request_id;
        default                 $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    upstream web {
        server web:3000;
        keepalive 16;
    }

    upstream admin {
        server admin:80;
        keepalive 8;
    }

    upstream client {
        server client:80;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;

        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-Id $req_id always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/auth/admin/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header x-cpf-usuario "";

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /api/v1/auth/client/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header x-cpf-usuario "";

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header x-cpf-usuario "";

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location = /app {
            return 301 /app/;
        }

        location /app/ {
            proxy_pass http://client/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location = /login {
            return 301 /app/login$is_args$args;
        }

        location /login/ {
            return 301 /app/login$is_args$args;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;

            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
