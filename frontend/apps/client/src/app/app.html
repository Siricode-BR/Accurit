@if (autenticado()) {
  <acc-app-shell
    brand="Accurit"
    portal="Portal do Escritório"
    [groups]="navegacao"
    [usuario]="usuario()"
    (sair)="sair()"
  >
    <span acc-shell-topbar class="ambiente" [class.ambiente--trial]="isTrial()">
      @if (rotuloAmbiente(); as rotulo) {
        {{ rotulo }}
      }
    </span>
    <router-outlet />
  </acc-app-shell>
} @else {
  <main class="app-publico">
    <router-outlet />
  </main>
}
