@if (autenticado()) {
  <acc-app-shell
    brand="Accurit"
    portal="Backoffice SaaS"
    [groups]="navegacao"
    [usuario]="usuario()"
    (sair)="sair()"
  >
    <span acc-shell-topbar class="escopo">Gestão global multi-tenant</span>
    <router-outlet />
  </acc-app-shell>
} @else {
  <main class="app-publico">
    <router-outlet />
  </main>
}
