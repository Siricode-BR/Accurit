name: accurit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: accurit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accurit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-accurit_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-accurit}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: accurit-backend
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CERTIFICATE_MASTER_KEY: ${CERTIFICATE_MASTER_KEY:?set CERTIFICATE_MASTER_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_ACCESS_TTL_SECS: ${AUTH_ACCESS_TTL_SECS:-900}
      AUTH_REFRESH_TTL_ADMIN_SECS: ${AUTH_REFRESH_TTL_ADMIN_SECS:-28800}
      AUTH_REFRESH_TTL_CLIENT_SECS: ${AUTH_REFRESH_TTL_CLIENT_SECS:-604800}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_SECS: ${AUTH_LOCKOUT_SECS:-900}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      SERPRO_TOKEN_URL: ${SERPRO_TOKEN_URL:-https://gateway.apiserpro.serpro.gov.br/token}
      SERPRO_SAPI_AUTH_URL: ${SERPRO_SAPI_AUTH_URL:-https://autenticacao.sapi.serpro.gov.br/authenticate}
      SERPRO_INTEGRA_TRIAL_URL: ${SERPRO_INTEGRA_TRIAL_URL:-https://gateway.apiserpro.serpro.gov.br/integra-contador-trial/v1}
      SERPRO_DIVIDA_ATIVA_TRIAL_URL: ${SERPRO_DIVIDA_ATIVA_TRIAL_URL:-https://gateway.apiserpro.serpro.gov.br/consulta-divida-ativa-trial/api/v1}
      SERPRO_INTEGRA_PROD_URL: ${SERPRO_INTEGRA_PROD_URL:-https://gateway.apiserpro.serpro.gov.br/integra-contador/v1}
      SERPRO_DIVIDA_ATIVA_PROD_URL: ${SERPRO_DIVIDA_ATIVA_PROD_URL:-}
      SERPRO_TRIAL_BEARER_TOKEN: ${SERPRO_TRIAL_BEARER_TOKEN:-}
      SERPRO_CONSUMER_KEY: ${SERPRO_CONSUMER_KEY:-}
      SERPRO_CONSUMER_SECRET: ${SERPRO_CONSUMER_SECRET:-}
      SERPRO_OPERATOR_HEADER_ENABLED: ${SERPRO_OPERATOR_HEADER_ENABLED:-true}
      DIVIDA_ATIVA_FALLBACK_CODIGO_CONTRIBUINTE: ${DIVIDA_ATIVA_FALLBACK_CODIGO_CONTRIBUINTE:-false}
      SERPRO_HTTP_CONNECT_TIMEOUT_SECS: ${SERPRO_HTTP_CONNECT_TIMEOUT_SECS:-5}
      SERPRO_HTTP_REQUEST_TIMEOUT_SECS: ${SERPRO_HTTP_REQUEST_TIMEOUT_SECS:-30}
      SERPRO_PROCURACAO_CACHE_TTL_SECS: ${SERPRO_PROCURACAO_CACHE_TTL_SECS:-300}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ./web
    container_name: accurit-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  admin:
    build:
      context: ./admin
      args:
        BASE_HREF: /admin/
    container_name: accurit-admin
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  client:
    build:
      context: ./client
      args:
        BASE_HREF: /app/
    container_name: accurit-client
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  schema-tool:
    profiles: ["tools"]
    build:
      context: ./backend
      target: diesel-tool
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-accurit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/accurit_schema_tmp
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-accurit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-accurit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend:/work
    working_dir: /work
    command: ["sh", "scripts/generate-schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    logging: *default-logging

  backend-test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: tester
    environment:
      APP_ENV: development
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TEST_DATABASE_ADMIN_URL: ${TEST_DATABASE_ADMIN_URL:?set TEST_DATABASE_ADMIN_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CERTIFICATE_MASTER_KEY: ${CERTIFICATE_MASTER_KEY:?set CERTIFICATE_MASTER_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    logging: *default-logging

  proxy:
    image: nginx:1.29-alpine
    container_name: accurit-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  postgres_data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
