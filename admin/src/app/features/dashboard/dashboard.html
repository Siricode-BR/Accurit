<main class="pagina">
  <header class="cabecalho">
    <span class="marca">Accurit Admin</span>
    <span class="sessao">
      <span class="email">{{ email() }}</span>
      <button type="button" class="sair" (click)="sair()">Sair</button>
    </span>
  </header>

  <section class="conteudo">
    <p class="sobretitulo">Visão geral</p>
    <h1>Dashboard</h1>
    <p class="descricao">Base administrativa do Accurit para a gestão do escritório.</p>

    <div class="status" [class]="'status status--' + estado()" aria-live="polite">
      <span class="ponto" aria-hidden="true"></span>
      <div>
        <strong>{{ rotulo() }}</strong>
        <span>{{ descricao() }}</span>
      </div>
    </div>
  </section>

  <footer class="rodape">Fase 2A &middot; Autenticação</footer>
</main>
