[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "accurit_backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.14", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "ipnet-address"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
governor = "0.10.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
